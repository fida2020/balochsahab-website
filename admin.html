<!DOCTYPE html>
<!--
  Internal admin tool — intentionally NOT part of the scripts/build-site.ps1
  pipeline (no public nav/footer/ads, nothing to templatize). Never run
  build-site.ps1 changes into this file; edit it directly.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Dashboard | Baloch Sahab</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://baloch-sahab-backend.onrender.com; form-action 'self'">
<script src="/assets/js/app-config.js"></script>
<script src="/assets/js/admin-common.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0f1a; color: #e8ecf4; font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 1.5rem; }
  .admin-nav { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .admin-nav a { color: #9aa7bd; text-decoration: none; font-size: 0.9rem; }
  .admin-nav a.active { color: #e8ecf4; font-weight: 600; }
  .admin-nav a:hover { color: #e8ecf4; }
  .admin-nav .spacer { flex: 1; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  #logoutBtn { background: none; border: 1px solid #2a3651; color: #9aa7bd; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat { background: #121a2b; border: 1px solid #232f47; border-radius: 10px; padding: 1rem; }
  .stat .label { font-size: 0.8rem; color: #9aa7bd; margin-bottom: 0.35rem; }
  .stat .value { font-size: 1.35rem; font-weight: 600; }
  section { background: #121a2b; border: 1px solid #232f47; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; overflow-x: auto; }
  section h2 { font-size: 0.95rem; margin: 0 0 0.85rem; color: #c9d2e3; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #1c2740; }
  th { color: #9aa7bd; font-weight: 500; }
  #status { color: #9aa7bd; }
  .neg { color: #ff8080; }
</style>
</head>
<body>
<nav class="admin-nav">
  <a href="/admin.html" class="active">Overview</a>
  <a href="/admin-withdrawals.html">Withdrawals</a>
  <a href="/admin-users.html">Users</a>
  <a href="/admin-settings.html">Settings</a>
  <span class="spacer"></span>
  <button id="logoutBtn">Log Out</button>
</nav>
<h1>Admin Overview</h1>
<div id="status"></div>
<div id="content" hidden>
  <div class="grid" id="statGrid"></div>
  <section>
    <h2>Revenue by Provider (net of chargebacks)</h2>
    <table><thead><tr><th>Provider</th><th>Net Credited</th><th>Entries</th></tr></thead><tbody id="providerBody"></tbody></table>
  </section>
  <section>
    <h2>Withdrawals by Status</h2>
    <table><thead><tr><th>Status</th><th>Count</th><th>Total</th></tr></thead><tbody id="withdrawStatusBody"></tbody></table>
  </section>
  <section>
    <h2>Recent Withdrawals</h2>
    <table><thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Requested</th></tr></thead><tbody id="recentWithdrawalsBody"></tbody></table>
  </section>
  <section>
    <h2>Recent Ledger Entries</h2>
    <table><thead><tr><th>User</th><th>Type</th><th>Amount</th><th>Note</th><th>When</th></tr></thead><tbody id="recentLedgerBody"></tbody></table>
  </section>
</div>
<script>
(function () {
  "use strict";
  var statusEl = document.getElementById("status");
  var contentEl = document.getElementById("content");
  AdminApp.wireLogoutButton();
  if (!AdminApp.requireSession()) return;

  var formatMinor = AdminApp.formatMinor;
  var escapeHtml = AdminApp.escapeHtml;

  statusEl.textContent = "Loading…";
  AdminApp.apiFetch("/admin/overview")
    .then(function (data) {
      render(data);
      statusEl.textContent = "";
      contentEl.hidden = false;
    })
    .catch(function (err) {
      statusEl.textContent = err.message || "Failed to load overview";
    });

  function render(data) {
    var stats = [
      { label: "Total Users", value: data.userCount },
      { label: "Total Available Balance", value: formatMinor(data.wallet.totalAvailableMinor) },
      { label: "Total Pending (Withdrawal Holds)", value: formatMinor(data.wallet.totalPendingMinor) },
      { label: "Total Lifetime Earned", value: formatMinor(data.wallet.totalLifetimeEarnedMinor) },
      { label: "Total Withdrawn (Paid Out)", value: formatMinor(data.wallet.totalWithdrawnMinor) },
    ];
    var statGrid = document.getElementById("statGrid");
    statGrid.innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="label">' + s.label + '</div><div class="value">' + s.value + "</div></div>";
    }).join("");

    document.getElementById("providerBody").innerHTML = data.revenueByProvider.map(function (p) {
      var cls = p.netCreditedMinor < 0 ? "neg" : "";
      return "<tr><td>" + p.provider + "</td><td class=\"" + cls + "\">" + formatMinor(p.netCreditedMinor) + "</td><td>" + p.entryCount + "</td></tr>";
    }).join("") || "<tr><td colspan=\"3\">No data yet</td></tr>";

    document.getElementById("withdrawStatusBody").innerHTML = data.withdrawalsByStatus.map(function (w) {
      return "<tr><td>" + w.status + "</td><td>" + w.count + "</td><td>" + formatMinor(w.totalMinor) + "</td></tr>";
    }).join("") || "<tr><td colspan=\"3\">No withdrawals yet</td></tr>";

    document.getElementById("recentWithdrawalsBody").innerHTML = data.recentWithdrawals.map(function (w) {
      return "<tr><td>" + escapeHtml(w.userEmail) + "</td><td>" + formatMinor(w.amountMinor) + "</td><td>" + escapeHtml(w.method) + "</td><td>" + w.status + "</td><td>" + new Date(w.requestedAt).toLocaleString() + "</td></tr>";
    }).join("") || "<tr><td colspan=\"5\">No withdrawals yet</td></tr>";

    document.getElementById("recentLedgerBody").innerHTML = data.recentLedgerEntries.map(function (e) {
      var cls = e.amountMinor < 0 ? "neg" : "";
      return "<tr><td>" + escapeHtml(e.userEmail) + "</td><td>" + e.type + "</td><td class=\"" + cls + "\">" + formatMinor(e.amountMinor) + "</td><td>" + escapeHtml(e.note || "") + "</td><td>" + new Date(e.createdAt).toLocaleString() + "</td></tr>";
    }).join("") || "<tr><td colspan=\"5\">No activity yet</td></tr>";
  }
})();
</script>
</body>
</html>
