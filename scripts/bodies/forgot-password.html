<section class="section" style="padding-top:clamp(3rem,8vw,5rem)">
<div class="container" style="max-width:420px">
<div class="earn-card reveal">
<h1 style="margin-top:0">Forgot Password</h1>
<p class="text-muted">Enter your account email and we'll send you a reset link.</p>
<form data-forgot-form>
<label>Email<input type="email" name="email" required autocomplete="username"></label>
<button class="btn btn-primary btn-block" type="submit">Send Reset Link</button>
<div class="form-error" data-forgot-error hidden></div>
<div class="form-success" data-forgot-success hidden>If that email is registered, a reset link has been sent.</div>
</form>
</div>
</div>
</section>
