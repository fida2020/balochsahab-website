<section class="auth-page">
<div class="container">
<div class="auth-card reveal">
<picture>
<source type="image/webp" srcset="/assets/img/logo-128.webp">
<img class="brand-logo" src="/assets/img/logo-128.png" alt="Baloch Sahab logo" width="52" height="52" decoding="async">
</picture>
<h1>Forgot Password</h1>
<p class="text-muted">Enter your registered email and we'll send you a secure password reset link.</p>
<form class="form" data-forgot-form>
<label>
Account Email Address
<input type="email" name="email" required autocomplete="username" placeholder="name@example.com">
</label>
<button class="btn btn-primary btn-block btn-lg" type="submit">Send Reset Link</button>
<div class="form-error" data-forgot-error hidden></div>
<div class="form-success" data-forgot-success hidden>If that email is registered in our system, a password reset link has been dispatched to your inbox.</div>
</form>
<div class="auth-footer-links">
<p><a href="/login.html" style="font-weight:600">&larr; Back to Login</a></p>
</div>
</div>
</div>
</section>
