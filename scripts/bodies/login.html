<section class="section" style="padding-top:clamp(3rem,8vw,5rem)">
<div class="container" style="max-width:420px">
<div class="earn-card reveal">
<h1 style="margin-top:0">Log In</h1>
<p class="text-muted">Welcome back — log in to see your balance and earning activity.</p>
<div data-google-signin-slot hidden>
<div id="google-signin-login"></div>
<div class="divider"><span>or</span></div>
</div>
<form data-login-form>
<label>Email<input type="email" name="email" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn btn-primary btn-block" type="submit">Log In</button>
<div class="form-error" data-login-error hidden></div>
</form>
<p class="text-muted mt-2">Don't have an account? <a href="/signup.html">Sign up</a></p>
<p class="text-muted"><a href="/forgot-password.html">Forgot your password?</a></p>
</div>
</div>
</section>
