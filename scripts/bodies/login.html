<section class="auth-page">
<div class="container">
<div class="auth-card reveal">
<picture>
<source type="image/webp" srcset="/assets/img/logo-128.webp">
<img class="brand-logo" src="/assets/img/logo-128.png" alt="Baloch Sahab logo" width="52" height="52" decoding="async">
</picture>
<h1>Welcome Back</h1>
<p class="text-muted">Sign in to your Baloch Sahab account to access your wallet and active tasks.</p>
<div data-google-signin-slot hidden>
<div id="google-signin-login" style="display:flex;justify-content:center;margin-bottom:0.5rem"></div>
<div class="divider"><span>or continue with email</span></div>
</div>
<form class="form" data-login-form>
<label>
Email Address
<input type="email" name="email" required autocomplete="username" placeholder="name@example.com">
</label>
<label>
Password
<input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
</label>
<button class="btn btn-primary btn-block btn-lg" type="submit">Sign In</button>
<div class="form-error" data-login-error hidden></div>
</form>
<div class="auth-footer-links">
<p><a href="/forgot-password.html" style="font-weight:600">Forgot your password?</a></p>
<p>Don't have an account? <a href="/signup.html" style="font-weight:700">Sign up here &rarr;</a></p>
</div>
</div>
</div>
</section>
