<section class="auth-page">
<div class="container">
<div class="auth-card reveal">
<picture>
<source type="image/webp" srcset="/assets/img/logo-128.webp">
<img class="brand-logo" src="/assets/img/logo-128.png" alt="Baloch Sahab logo" width="48" height="48" decoding="async">
</picture>
<h1>Log In</h1>
<p class="text-muted">Welcome back — log in to see your balance and earning activity.</p>
<div data-google-signin-slot hidden>
<div id="google-signin-login"></div>
<div class="divider"><span>or</span></div>
</div>
<form class="form" data-login-form>
<label>Email<input type="email" name="email" required autocomplete="username" placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></label>
<button class="btn btn-primary btn-block" type="submit">Log In</button>
<div class="form-error" data-login-error hidden></div>
</form>
<div class="auth-footer-links">
<p>Don't have an account? <a href="/signup.html">Sign up</a></p>
<p><a href="/forgot-password.html">Forgot your password?</a></p>
</div>
</div>
</div>
</section>
