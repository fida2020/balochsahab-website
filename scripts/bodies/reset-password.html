<section class="auth-page">
<div class="container">
<div class="auth-card reveal">
<picture>
<source type="image/webp" srcset="/assets/img/logo-128.webp">
<img class="brand-logo" src="/assets/img/logo-128.png" alt="Baloch Sahab logo" width="52" height="52" decoding="async">
</picture>
<h1>Set New Password</h1>
<p class="text-muted">Enter your new secure password below to regain access.</p>
<form class="form" data-reset-form>
<label>
New Password (min 8 characters)
<input type="password" name="newPassword" required minlength="8" autocomplete="new-password" placeholder="Create a new password">
</label>
<button class="btn btn-primary btn-block btn-lg" type="submit">Update Password</button>
<div class="form-error" data-reset-error hidden></div>
<div class="form-success" data-reset-success hidden>Password updated successfully! You can now <a href="/login.html" style="font-weight:700">log in here</a>.</div>
</form>
<div class="auth-footer-links">
<p><a href="/login.html" style="font-weight:600">&larr; Back to Login</a></p>
</div>
</div>
</div>
</section>
