<section class="section" style="padding-top:clamp(3rem,8vw,5rem)">
<div class="container" style="max-width:420px">
<div class="earn-card reveal">
<h1 style="margin-top:0">Reset Password</h1>
<p class="text-muted">Enter your new password below.</p>
<form data-reset-form>
<label>New Password (min 8 characters)<input type="password" name="newPassword" required minlength="8" autocomplete="new-password"></label>
<button class="btn btn-primary btn-block" type="submit">Reset Password</button>
<div class="form-error" data-reset-error hidden></div>
<div class="form-success" data-reset-success hidden>Password updated. You can now <a href="/login.html">log in</a>.</div>
</form>
</div>
</div>
</section>
