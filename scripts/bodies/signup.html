<section class="section" style="padding-top:clamp(3rem,8vw,5rem)">
<div class="container" style="max-width:420px">
<div class="earn-card reveal">
<h1 style="margin-top:0">Sign Up</h1>
<p class="text-muted">Create your free account and start earning today.</p>
<div data-google-signin-slot hidden>
<div id="google-signin-signup"></div>
<div class="divider"><span>or</span></div>
</div>
<form data-signup-form>
<label>Email<input type="email" name="email" required autocomplete="username"></label>
<label>Password (min 8 characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
<button class="btn btn-primary btn-block" type="submit">Sign Up</button>
<div class="form-error" data-signup-error hidden></div>
<div class="form-success" data-signup-success hidden></div>
</form>
<p class="text-muted mt-2">Already have an account? <a href="/login.html">Log in</a></p>
</div>
</div>
</section>
