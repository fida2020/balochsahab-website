<section class="auth-page">
<div class="container">
<div class="auth-card reveal">
<picture>
<source type="image/webp" srcset="/assets/img/logo-128.webp">
<img class="brand-logo" src="/assets/img/logo-128.png" alt="Baloch Sahab logo" width="52" height="52" decoding="async">
</picture>
<h1>Verify Your Email</h1>
<p class="text-muted">Enter the 6-digit verification code sent to your registered email address.</p>
<form class="form" data-verify-form>
<label>
6-Digit Verification Code
<input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" style="text-align:center;font-size:1.4rem;letter-spacing:0.3em;font-weight:700">
</label>
<button class="btn btn-primary btn-block btn-lg" type="submit">Verify &amp; Activate Account</button>
<div class="form-error" data-verify-error hidden></div>
<div class="form-success" data-verify-success hidden>Email verified successfully! Redirecting to your dashboard…</div>
</form>
<div class="auth-footer-links">
<p class="text-muted" style="margin-bottom:0.75rem">Didn't receive the code?</p>
<button class="btn btn-secondary btn-block" type="button" data-resend-verification>Resend Verification Code</button>
</div>
</div>
</div>
</section>
