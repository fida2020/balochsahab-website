<section class="section" style="padding-top:clamp(3rem,8vw,5rem)">
<div class="container" style="max-width:420px">
<div class="earn-card reveal">
<h1 style="margin-top:0">Verify Your Email</h1>
<p class="text-muted">Enter the 6-digit code we sent to your email address.</p>
<form data-verify-form>
<label>Verification Code<input type="text" name="otp" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"></label>
<button class="btn btn-primary btn-block" type="submit">Verify Email</button>
<div class="form-error" data-verify-error hidden></div>
<div class="form-success" data-verify-success hidden>Email verified!</div>
</form>
<p class="text-muted mt-2"><button class="btn btn-secondary btn-block" type="button" data-resend-verification>Resend Code</button></p>
</div>
</div>
</section>
