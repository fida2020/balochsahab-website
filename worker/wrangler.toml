name = "balochsahab-app"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Path-based routes on the existing balochsahab.com zone.
# No new DNS record and no subdomain - GitHub Pages keeps serving every
# other path on this zone exactly as it does today.
routes = [
  { pattern = "balochsahab.com/auth/*", zone_name = "balochsahab.com" },
  { pattern = "balochsahab.com/api/*", zone_name = "balochsahab.com" },
  { pattern = "balochsahab.com/media/*", zone_name = "balochsahab.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "balochsahab-app"
database_id = "d9353a29-669c-451d-9358-e75a399b48f6"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "baloch-sahab-media"

[triggers]
# Sweeps due scheduled posts. Adjust cadence once real usage volume is known.
crons = ["*/5 * * * *"]

[vars]
PUBLIC_ORIGIN = "https://balochsahab.com"
TIKTOK_REDIRECT_URI = "https://balochsahab.com/auth/tiktok/callback"

# Secrets (never put these here - set via `wrangler secret put <NAME>`):
#   TIKTOK_CLIENT_KEY
#   TIKTOK_CLIENT_SECRET
#   TOKEN_ENCRYPTION_KEY   (32 random bytes, base64 - e.g. `openssl rand -base64 32`)
#   ANTHROPIC_API_KEY
